<section id="social-share-section">
  <button type="button" class="btn-site btn-site-ghost" id="post-share" data-i18n="ui.share" data-url="{{ page.url | absolute_url }}" data-title="{{ page.title | xml_escape }}" data-copied-en="Link copied" data-copied-es="Enlace copiado">Share</button>
</section>
<script>
(function () {
  var btn = document.getElementById('post-share');
  if (!btn) {
    return;
  }
  btn.addEventListener('click', function () {
    var url = btn.getAttribute('data-url');
    var title = btn.getAttribute('data-title') || document.title;
    var lang = document.documentElement.getAttribute('data-site-lang') || document.documentElement.lang;
    var copied = lang === 'es' ? btn.getAttribute('data-copied-es') : btn.getAttribute('data-copied-en');
    if (navigator.share) {
      navigator.share({ title: title, url: url }).catch(function () {});
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        var prev = btn.textContent;
        btn.textContent = copied || 'Link copied';
        setTimeout(function () { btn.textContent = prev; }, 2000);
      });
      return;
    }
    window.prompt(copied || url, url);
  });
})();
</script>
